<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>COM-CHECK</title>
  
  <link rel="manifest" href="manifest.json">
  <!-- เปลี่ยนสีแถบสถานะของเบราว์เซอร์บนมือถือให้เป็นสีม่วงพาสเทล -->
  <meta name="theme-color" content="#F3F0FF">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="COM-CHECK">
  <link rel="apple-touch-icon" href="icon-512.png">

  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background-color: #F3F0FF; /* พื้นหลังหลักสีม่วงพาสเทล */
    }

    /* 🎨 สไตล์หน้า Splash Screen พาสเทล */
    #splash-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: #F3F0FF; /* ปรับพื้นหลังหน้าโหลดเป็นม่วงพาสเทลนุ่มๆ */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease-out, visibility 0.5s;
    }

    /* สไตล์รูปโลโก้กลางจอ */
    .splash-logo {
      width: 120px;
      height: 120px;
      border-radius: 30px;
      /* เงาฟุ้งแบบสีม่วงอ่อนนุ่ม ละมุนตา ไม่เงาดำแข็ง */
      box-shadow: 0 12px 32px rgba(123, 97, 255, 0.18);
      margin-bottom: 20px;
      animation: pulse-animation 2s infinite ease-in-out;
    }

    /* ข้อความโหลด */
    .loading-text {
      color: #7B61FF; /* สีม่วงเน้นหลัก (ตรงกับตัวเลขและขีดสลับหน้าในแอป) */
      font-family: 'Kanit', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
      letter-spacing: 2px;
      font-weight: 600;
      text-transform: uppercase;
    }

    /* แอนิเมชันโลโก้เต้นเบาๆ */
    @keyframes pulse-animation {
      0% { transform: scale(0.95); opacity: 0.85; }
      50% { transform: scale(1); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.85; }
    }

    /* เมื่อโหลดเสร็จจะซ่อนหน้านี้ */
    .fade-out {
      opacity: 0;
      visibility: hidden;
    }

    iframe {
      width: 100%; height: 100%;
      border: none; display: block;
    }
  </style>
</head>
<body>

  <div id="splash-screen">
    <img src="icon-512.png" alt="Logo" class="splash-logo">
    <div class="loading-text">COM-CHECK LOADING...</div>
  </div>

  <iframe 
    id="app-frame"
    src="https://script.google.com/macros/s/AKfycbyu06C8RJtTUOZYNKxc0M3N0wx6MrsTf-ZiwKPB0aR6ext7nmLOVQi78DBxf75MxlCG/exec" 
    sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-modals allow-popups-to-escape-to-sandbox">
  </iframe>

  <script>
    // ⚙️ ตรวจจับเมื่อ iframe โหลดเนื้อหาเสร็จ
    const iframe = document.getElementById('app-frame');
    const splash = document.getElementById('splash-screen');

    iframe.onload = function() {
      splash.classList.add('fade-out');
      console.log('App is ready!');
    };

    // ลงทะเบียน Service Worker สำหรับ PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('data:text/javascript;base64,c2VsZi5hZGRFdmVudExpc3RlbmVyKCdmZXRjaCcsIGU9PntlLnJlc3BvbmRXaXRoKGZldGNoKGUucmVxdWVzdCkpO30pOw==', { scope: './' });
      });
    }
  </script>

</body>
</html>
